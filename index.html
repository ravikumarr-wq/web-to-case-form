<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Accredited Course Presentation Request</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #F9F9F9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .form-container {
      background: #fff;
      padding: 25px 30px 90px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    img._logo_jlm3i_15 {
      width: 165px;
      display: block;
      margin-bottom: 10px;
    }

    /* 🔹 Sticky Business Unit */
    .sticky-header {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 10;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    h2 {
      text-align: center;
      margin: 0;
      font-size: 20px;
      color: #333;
    }

    p {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin: 20px 0 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    .required::after {
      content: " *";
      color: red;
    }

    input, textarea, select {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
      box-sizing: border-box;
    }

    textarea { min-height: 80px; resize: vertical; }

    .char-counter {
      font-size: 12px;
      color: #666;
      text-align: right;
      margin-top: 4px;
    }

    /* 🔹 Two-column rows */
    .row {
      display: flex;
      gap: 12px;
    }

    .col {
      flex: 1;
    }

    /* 🔹 Sticky submit bar */
    .submit-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: linear-gradient(to top, #ffffff, #f2f6ff);
      border-top: 1px solid #ddd;
      padding: 12px;
      display: flex;
      justify-content: center;
      z-index: 20;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.08);
    }

    .submit-bar input {
      max-width: 560px;
      width: 100%;
      background: #0066CC;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .submit-bar input:hover {
      background: #0055AA;
    }

    .error {
      color: red;
      font-size: 13px;
      display: none;
    }

    .date-range-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .date-field { flex: 1; }
  </style>
</head>

<body>

<div class="form-container">

  <img src="https://res.cloudinary.com/monday-platform/image/upload/v1732596123/board_views_images/logos/1732596123472_a737dcae-3422-5b1e-17b0-2109a4106b0f.jpg"
       class="_logo_jlm3i_15">

  <div class="sticky-header">
    <h2 id="formHeading">Accredited Course Presentation Request</h2>
  </div>

  <p>Complete this form to request an in-person, instructor-led training/seminar for your firm or business.</p>

  <form id="webToCaseForm"
        action="https://certainteed--akcrma.sandbox.my.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DWA000002ckDZ"
        method="POST">

    <input type="hidden" name="orgid" value="00DWA000002ckDZ">
    <input type="hidden" id="recordType" name="recordType" value="012WA000000lVJh">
    <input type="hidden" id="external" name="external" value="1">

    <label class="required">Course Name</label>
    <input id="00N0V000008zRGv" name="00N0V000008zRGv" required>

    <label class="required">Your Name</label>
    <input id="00N3w000008x6NN" name="00N3w000008x6NN" required>

    <label class="required">Your Email</label>
    <input id="00N3w000008x6NX" name="00N3w000008x6NX" type="email" required>

    <label class="required">Your Phone Number</label>
    <input name="phone" required>

    <label class="required">Firm / Business Name</label>
    <input id="00NWA000002EHe9" name="00NWA000002EHe9" required>

    <!-- 🔹 Address layout -->
    <div class="row">
      <div class="col">
        <label>Mailing Country</label>
        <select id="00NWA000002GKb7" name="00NWA000002GKb7">
          <option value="">--None--</option>
          <option value="USA">USA</option>
          <option value="Canada">Canada</option>
        </select>
      </div>
      <div class="col">
        <label>Mailing State / Province</label>
        <select id="00NWA000002GKjB" name="00NWA000002GKjB"></select>
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Mailing City</label>
        <input id="00NWA000002GKkn" name="00NWA000002GKkn">
      </div>
      <div class="col">
        <label>Postal Code</label>
        <input id="00NWA000002GKsr" name="00NWA000002GKsr">
      </div>
    </div>

    <label>Mailing Street</label>
    <input id="00NWA000002GKo1" name="00NWA000002GKo1">

    <label>Approximate Number of Attendees</label>
    <input id="00NWA000002EHhN" name="00NWA000002EHhN" type="number">

    <label class="required">Dates for Presentation</label>
    <div class="date-range-container">
      <div class="date-field"><input id="startDate" type="date" required></div>
      →
      <div class="date-field"><input id="endDate" type="date" required></div>
    </div>

    <input type="hidden" id="sfStartDate" name="00NWA000002EHkb">
    <input type="hidden" id="sfEndDate" name="00NWA000002EHmD">

    <div id="dateError" class="error">Start Date cannot be later than End Date.</div>

    <label>Additional Comments</label>
    <textarea id="00NVm000003SjdM" name="00NVm000003SjdM"></textarea>
    <div id="charCounter" class="char-counter">0/2000</div>

  </form>
</div>

<div class="submit-bar">
  <input type="submit" value="Submit" form="webToCaseForm">
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const course = params.get("course");
  const businessUnit = params.get("businessUnit");

  if (course) document.getElementById("00N0V000008zRGv").value = course;
  if (businessUnit) document.getElementById("formHeading").textContent = businessUnit;

  if (course || businessUnit) {
    history.replaceState({}, document.title, location.origin + location.pathname);
  }

  const comments = document.getElementById("00NVm000003SjdM");
  const counter = document.getElementById("charCounter");
  comments.addEventListener("input", () => counter.textContent = `${comments.value.length}/2000`);
</script>

</body>
</html>
